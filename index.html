<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envira</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="logo">ENVIRA</div>

    <div class="nav-label">Monitor</div>
    <button class="ni active"><span class="ic">⊞</span><span class="word">Dashboard</span></button>
    <button class="ni"><span class="ic">☼</span><span class="word">Temperature</span></button>
    <button class="ni"><span class="ic">≈</span><span class="word">Humidity</span></button>

  </nav>

  <div class="main-area">
    <div class="page">
      <div class="topbar">
        <h1>Dashboard</h1>
        <button class="connect-btn" id="connectBtn">Connect Device</button>
      </div>
      <p class="datetime" id="datetime">--</p>

      <!-- LAYER 1: WEATHER -->
      <div class="db-card">
        <div class="db-card-hd">
          <div class="db-card-title">Cuaca Bekasi</div>
          <div class="db-card-sub" id="weatherCond">Memuat cuaca...</div>
        </div>
        <div class="weather-body">
          <div class="w-icon" id="weatherIcon"></div>
          <div class="w-temp"><span id="weatherTemp">--</span><span class="unit">°C</span></div>
          <div class="w-badges">
            <div class="w-badge">Terasa<span id="weatherFeels">--</span></div>
            <div class="w-badge">Kelembapan<span id="weatherHum">--</span></div>
            <div class="w-badge">Angin<span id="weatherWind">--</span></div>
          </div>
        </div>
      </div>

      <!-- LAYER 2: TEMPERATURE -->
      <div class="grid-row">
        <div class="card metric">
          <p class="title">Temperature</p>
          <p class="bignum"><span id="tempNow">0.0</span><span class="unit">°C</span></p>
          <p class="kchg" id="tempStatus">--</p>
          <p class="minmax" id="tempMinMax">Tertinggi -- · Terendah --</p>
        </div>
        <div class="db-card trend">
          <div class="db-card-hd">
            <div class="db-card-title">Temperature Trend</div>
            <div class="db-card-sub">20 readings</div>
          </div>
          <div class="chart-wrap"><canvas id="chartTemp"></canvas></div>
        </div>
      </div>

      <!-- LAYER 3: HUMIDITY -->
      <div class="grid-row">
        <div class="card metric">
          <p class="title">Humidity</p>
          <p class="bignum"><span id="humNow">0.0</span><span class="unit">%</span></p>
          <p class="kchg" id="humStatus">--</p>
          <p class="minmax" id="humMinMax">Tertinggi -- · Terendah --</p>
        </div>
        <div class="db-card trend">
          <div class="db-card-hd">
            <div class="db-card-title">Humidity Trend</div>
            <div class="db-card-sub">20 readings</div>
          </div>
          <div class="chart-wrap"><canvas id="chartHum"></canvas></div>
        </div>
      </div>
    </div>

    <footer class="page-footer">Made with art by <strong>Nevillaz</strong></footer>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
